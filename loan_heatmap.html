<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shelter Lending &mdash; Portfolio Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2430; --ink-soft:#5b6472; --surface:#ffffff; --surface-muted:#f4f5f7;
    --line:rgba(28,36,48,0.09); --accent:#d9480f; --accent-soft:rgba(217,72,15,0.16);
    --ab:#1c6fd1; --bc:#d9480f; --mb:#1a9e6b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--ink);background:#e9ebe6;}
  #map{position:absolute;inset:0;z-index:0;}
  .leaflet-tile-pane{filter:saturate(0.85) brightness(1.03);}

  .topbar{
    position:absolute; top:16px; left:16px; right:16px; z-index:1000;
    background:rgba(255,255,255,0.92); backdrop-filter:blur(10px);
    border:1px solid var(--line); border-radius:14px;
    box-shadow:0 8px 28px rgba(20,24,30,0.12);
    display:flex; align-items:center; gap:28px;
    padding:14px 22px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px; margin-right:4px;}
  .brand .mark{width:26px;height:26px;flex:none;}
  .brand .name{font-weight:700; font-size:14.5px; letter-spacing:0.01em;}
  .brand .sub{font-size:11px; color:var(--ink-soft); font-weight:500;}

  .stat{display:flex; flex-direction:column; gap:2px; min-width:118px;}
  .stat .label{font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); font-weight:600;}
  .stat .value{font-size:18px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums;}

  .spacer{flex:1;}

  .filters{display:flex; align-items:center; gap:8px;}
  .filters .flabel{font-size:11px; color:var(--ink-soft); font-weight:600; margin-right:2px;}
  .chip{
    appearance:none; border:1px solid var(--line); background:var(--surface-muted);
    color:var(--ink); font-size:12.5px; font-weight:600; font-family:inherit;
    padding:7px 13px; border-radius:999px; cursor:pointer; transition:all .15s ease;
    display:flex; align-items:center; gap:6px;
  }
  .chip .dot{width:7px;height:7px;border-radius:50%;}
  .chip:hover{background:#eceeec;}
  .chip.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .chip.active .count{opacity:0.75;}
  .chip .count{font-weight:500; opacity:0.6;}

  .legend{
    position:absolute; left:16px; bottom:16px; z-index:1000;
    background:rgba(255,255,255,0.92); backdrop-filter:blur(10px);
    border:1px solid var(--line); border-radius:12px;
    box-shadow:0 8px 24px rgba(20,24,30,0.12);
    padding:12px 16px; font-size:11.5px; color:var(--ink-soft);
    display:flex; align-items:center; gap:10px;
  }
  .legend .swatch{width:10px;height:10px;border-radius:50%;background:var(--accent);opacity:0.65;border:1px solid rgba(180,50,10,0.8);}

  .attrib{
    position:absolute; right:10px; bottom:6px; z-index:1000;
    font-size:9.5px; color:rgba(30,30,30,0.45);
  }

  .leaflet-popup-content-wrapper{border-radius:10px; box-shadow:0 10px 30px rgba(20,24,30,0.18);}
  .leaflet-popup-content{margin:11px 14px; font-family:'Inter',sans-serif;}
  .popup-city{font-weight:700; font-size:13.5px; margin-bottom:4px;}
  .popup-row{font-size:12px; color:#444; line-height:1.5;}
  .popup-row b{color:var(--ink);}

  @media (max-width: 760px){
    .topbar{gap:16px; padding:12px 16px;}
    .stat{min-width:84px;}
    .stat .value{font-size:15px;}
    .filters{width:100%; order:10;}
  }
</style>
</head>
<body>

<div id="map"></div>

<div class="topbar">

      <path d="M12 2.5v19M3.5 7 12 11.5 20.5 7M3.5 17 12 11.5 20.5 17" stroke="#d9480f" stroke-width="1.1" stroke-linejoin="round"/>
    </svg>
    <div>
      <div class="name">Shelter Lending</div>
      <div class="sub">Portfolio Map</div>
    </div>
  </div>

  <div class="stat"><div class="label">Total Loan Amount</div><div class="value" id="statBalance">$0</div></div>

  <div class="stat"><div class="label">Number of Loans</div><div class="value" id="statCount">0</div></div>

  <div class="spacer"></div>

  <div class="filters">
    <span class="flabel">Province</span>
    <button class="chip active" data-prov="ALL"><span>All</span><span class="count" id="cnt-ALL"></span></button>

    <button class="chip" data-prov="MB"><span class="dot" style="background:#1a9e6b"></span><span>MB</span><span class="count" id="cnt-MB"></span></button>
  </div>
</div>

<div class="legend">
  <span class="swatch"></span>
  <span>Each dot is one funded loan, scattered around its city &mdash; darker clusters mean more loans in that area.</span>
</div>

const PROV_TOTALS = {"AB":{"count":102,"balance":20098116.83},"BC":{"count":218,"balance":58952526.349999994},"MB":{"count":39,"balance":6343117.28}};
const TOTAL_BALANCE = 85393760;
const AVG_BALANCE = 237866;
const NUM_LOANS = 359;
const AVG_LTV = 62.1;

const PROV_COLOR = { BC: "#d9480f", AB: "#1c6fd1", MB: "#1a9e6b" };

function fmtMoney(n){
  return "$" + Math.round(n).toLocaleString("en-US");
}

document.getElementById("statBalance").textContent = fmtMoney(TOTAL_BALANCE);
document.getElementById("statAvg").textContent = fmtMoney(AVG_BALANCE);
document.getElementById("statLtv").textContent = AVG_LTV.toFixed(1) + "%";
document.getElementById("statCount").textContent = NUM_LOANS.toLocaleString("en-US");

document.getElementById("cnt-ALL").textContent = "(" + NUM_LOANS + ")";
for (const p of ["BC","AB","MB"]) {
  const el = document.getElementById("cnt-" + p);
  if (el) el.textContent = "(" + (PROV_TOTALS[p] ? PROV_TOTALS[p].count : 0) + ")";
}

const CANADA_BOUNDS = [[41.0, -141.5], [83.5, -51.5]];
const map = L.map('map', {
  zoomControl: true, attributionControl: true,
  maxBounds: CANADA_BOUNDS, maxBoundsViscosity: 0.8, minZoom: 3,
}).setView([52.5, -119.5], 5.6);

// Standard OpenStreetMap tiles - free, no API key required (CARTO's basemap
// service now requires one even for its previously-free styles).
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, minZoom: 3, subdomains: 'abc', noWrap: true,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
}).addTo(map);

const markers = [];
for (const pt of POINTS) {
  const color = PROV_COLOR[pt.prov] || "#d9480f";
  const m = L.circleMarker([pt.lat, pt.lon], {
    radius: 4,
    weight: 1,
    color: color,
    opacity: 0.85,
    fillColor: color,
    fillOpacity: 0.45,
  });
  m.bindPopup(
    '<div class="popup-city">' + pt.city + ', ' + pt.prov + '</div>' +
    '<div class="popup-row"><b>' + pt.city_count + '</b> loan' + (pt.city_count === 1 ? '' : 's') + ' in this area</div>' +
    '<div class="popup-row">Combined balance: <b>' + fmtMoney(pt.city_balance) + '</b></div>'
  );
  m.prov = pt.prov;
  m.addTo(map);
  markers.push(m);
}

const chips = document.querySelectorAll('.chip');
chips.forEach(chip => {
  chip.addEventListener('click', () => {
    chips.forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    const prov = chip.getAttribute('data-prov');
    let shownCount = 0, shownBalance = 0;
    for (const m of markers) {
      const show = (prov === 'ALL' || m.prov === prov);
      const el = m.getElement();
      if (el) el.style.display = show ? '' : 'none';
    }
    if (prov === 'ALL') {
      shownCount = NUM_LOANS; shownBalance = TOTAL_BALANCE;
    } else {
      shownCount = PROV_TOTALS[prov] ? PROV_TOTALS[prov].count : 0;
      shownBalance = PROV_TOTALS[prov] ? PROV_TOTALS[prov].balance : 0;
    }
    document.getElementById("statBalance").textContent = fmtMoney(shownBalance);
    document.getElementById("statAvg").textContent = fmtMoney(shownCount ? shownBalance/shownCount : 0);
    document.getElementById("statCount").textContent = shownCount.toLocaleString("en-US");
  });
});
